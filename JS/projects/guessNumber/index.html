<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Guess a number between 1 and 100</p>
        <p>You get 10 attempts to guess the right number</p>
        </br>
        <form class="form">
            <label for="guessFeild" id="guess">Guess a number</label>
            <input type="text" id="guessFeild" class="guessFeild">
            <input type="submit" id="submit" value="submit" class="submitguess">
        </form>
        <div class="resultparams">
            <p>Previous Guess: <span class="guesses"></span></p>
            <p>Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="loworhigh"></p>
        </div>
    </div>
    <script src="guessnumber.js"></script>
</body>

</html>
