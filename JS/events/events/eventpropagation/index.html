<body>
    <h2>Amazing Images</h2>
    <div>
        <ul id="places">
            <li id="eiffel-tower">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg"
                    alt="Eiffel Tower">
                <p>Eiffel Tower, France</p>
            </li>

            <li id="taj-mahal">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg" alt="Taj Mahal">
                <p>Taj Mahal, India</p>
            </li>

            <li id="great-wall">
                <img src="https://picsum.photos/300/200?random=3" alt="Great Wall of China">
                <p>Great Wall of China</p>
            </li>

            <li id="statue-liberty">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Statue_of_Liberty_7.jpg"
                    alt="Statue of Liberty">
                <p>Statue of Liberty, USA</p>
            </li>

            <li id="machu-picchu">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/eb/Machu_Picchu%2C_Peru.jpg"
                    alt="Machu Picchu">
                <p>Machu Picchu, Peru</p>
            </li>

            <li id="sydney-opera">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/40/Sydney_Opera_House_Sails.jpg"
                    alt="Sydney Opera House">
                <p>Sydney Opera House, Australia</p>
            </li>
            <li id="google">
                <a href="https://google.com" target="_blank" style="color: rgb(244, 211, 166);">
                    Google
                </a>
            </li>
        </ul>
    </div>
</body>
