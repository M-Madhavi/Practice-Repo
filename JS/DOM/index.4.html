<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #212121;color: #fff;">
    <ul class="language">
        <li>Js</li>
        <li>Node</li>
        <li>Angular</li>
        <li>React</li>
        <li>Mongo</li>
        <li>Aws</li>
    </ul>
</body>
<script>

    function addLanguage(language) {
        const li = document.createElement('li')
        li.innerHTML = `${language}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")

    function addlang(lan) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(lan))
        document.querySelector('.language').appendChild(li)
    }
    addlang('sql')
    //Edit

    const secondLang = document.querySelector("li:nth-child(7)")
    //secondLang.innerHTML = 'Mojo'
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)

    const lastsecondChild = document.querySelector("li:last-child")
    lastsecondChild.outerHTML = '<li>Updated</li>'

    //remove

    const lastlang = document.querySelector("li:last-child")

    // lastlang.remove()
</script>

</html>
